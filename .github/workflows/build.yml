name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so every build uses the same Theos and Xcode as the tested release.
  THEOS_COMMIT: 67db2ab8d950910161730de77c322658ea3e6b44
  XCODE_APP: /Applications/Xcode_26.2.app

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          version=$(grep '^Version:' control | cut -d' ' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Version $version in control"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install tools
        run: brew install ldid make xz

      - name: Install Theos
        run: |
          THEOS="$RUNNER_TEMP/theos"
          git clone --quiet https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --quiet "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive --quiet
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build
        run: gmake package ROOTLESS=1 FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: Terminal-${{ steps.version.outputs.version }}
          path: packages/*.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb=$(ls packages/*.deb)
          {
            awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## /{on=0} on' CHANGELOG.md
            echo
            echo "**Install:** add https://dev.rtrdd.fyi to Sileo or Zebra, or install the .deb below."
            echo "Rootless jailbreak, iOS 15 or later."
            echo
            echo "SHA-256: \`$(shasum -a 256 "$deb" | cut -d' ' -f1)\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$deb" --title "Terminal $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish to APT repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::IOS_REPO_TOKEN isn't set, so the APT repo wasn't updated."
            exit 0
          fi
          gh api repos/aayy-dev/aayy-dev.github.io/dispatches \
            -f event_type=publish-deb \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
